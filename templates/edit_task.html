{% extends "base.html" %}

{% block title %}Editar tarefa | Gerenciador de tarefas{% endblock %}

{% block content %}
    <div class="row justify-content-center">
        <section class="col-lg-8">
            <h1 class="h3 mb-4">Editar tarefa</h1>
            <form action="{{ url_for('edit_task', task_id=task.id) }}" method="post">
                <div class="mb-3">
                    <label class="form-label" for="title">Título</label>
                    <input
                        class="form-control"
                        id="title"
                        name="title"
                        type="text"
                        maxlength="200"
                        value="{{ form_data.get('title', '') }}"
                        required
                    >
                </div>
                <div class="mb-3">
                    <label class="form-label" for="description">Descrição</label>
                    <textarea class="form-control" id="description" name="description" rows="4">{{ form_data.get('description', '') }}</textarea>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="status">Status</label>
                    <select class="form-select" id="status" name="status" required>
                        {% for status in statuses %}
                            <option value="{{ status }}" {% if form_data.get('status', '') == status %}selected{% endif %}>{{ status }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="mb-4">
                    <label class="form-label" for="shared_with">Compartilhar com</label>
                    <select class="form-select" id="shared_with" name="shared_with">
                        <option value="" {% if form_data.get('shared_with', '') == '' %}selected{% endif %}>Não compartilhar</option>
                        {% if task.shared_with == current_user.id %}
                            <option value="{{ current_user.id }}" {% if form_data.get('shared_with', '') == current_user.id|string %}selected{% endif %}>{{ current_user.username }}</option>
                        {% endif %}
                        {% for user in users %}
                            <option value="{{ user.id }}" {% if form_data.get('shared_with', '') == user.id|string %}selected{% endif %}>{{ user.username }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="d-flex flex-wrap gap-2">
                    <button class="btn btn-primary" type="submit">Salvar alterações</button>
                    <a class="btn btn-outline-secondary" href="{{ url_for('dashboard') }}">Voltar ao dashboard</a>
                </div>
            </form>
        </section>
    </div>
{% endblock %}
