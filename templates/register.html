{% extends "base.html" %}

{% block title %}Cadastro | Gerenciador de tarefas{% endblock %}

{% block content %}
    <div class="row justify-content-center">
        <section class="col-md-7 col-lg-5">
            <h1 class="h3 mb-4">Criar conta</h1>
            <form action="{{ url_for('register') }}" method="post">
                <div class="mb-3">
                    <label class="form-label" for="username">Nome de usuário</label>
                    <input class="form-control" id="username" name="username" type="text" autocomplete="username" required>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="password">Senha</label>
                    <input class="form-control" id="password" name="password" type="password" autocomplete="new-password" required>
                </div>
                <button class="btn btn-primary" type="submit">Cadastrar</button>
            </form>
            <p class="mt-3 mb-0">Já tem uma conta? <a href="{{ url_for('login') }}">Entre</a>.</p>
        </section>
    </div>
{% endblock %}
