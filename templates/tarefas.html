<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarefas - Gerenciador de Tarefas</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <main class="container">
        <header class="topo">
            <div>
                <p class="mini">MEU SISTEMA</p>
                <h1>Minhas tarefas</h1>
            </div>
            <a class="botao secundario pequeno" href="/">Início</a>
        </header>

        <section class="card nova-tarefa">
            <h2>Nova tarefa</h2>
            <div class="linha">
                <input id="novaTarefa" type="text" placeholder="Digite uma tarefa...">
                <button class="botao principal" onclick="adicionarTarefa()">Adicionar</button>
            </div>
        </section>

        <section class="card">
            <div class="titulo-lista">
                <h2>Lista de tarefas</h2>
                <span id="contador">0 tarefas</span>
            </div>

            <ul id="listaTarefas" class="lista"></ul>
            <p id="vazio" class="vazio">Nenhuma tarefa cadastrada.</p>
        </section>
    </main>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
